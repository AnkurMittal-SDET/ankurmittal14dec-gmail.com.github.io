 <!-- 7. MINIMALIST FOOTER & CONTACT HUB -->
    <footer id="contact">
        <h2>Let's build reliable software systems.</h2>
        <p>Available for test leadership consulting engagements, framework design, or senior QA leadership roles.</p>
        
        <!-- CUSTOM INTERACTIVE CONTACT FORM -->
        <div class="contact-form-container">
            <form action="https://formspree.io" method="POST" class="contact-form">
                <div class="form-row">
                    <div class="form-group">
                        <label for="name">Your Name</label>
                        <input type="text" id="name" name="name" placeholder="John Doe" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Your Email</label>
                        <input type="email" id="email" name="_replyto" placeholder="john@example.com" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="5" placeholder="Describe your project requirements or open role..." required></textarea>
                </div>
                <!-- Anti-spam honeypot field hidden from users -->
                <input type="text" name="_gotcha" style="display:none">
                <button type="submit" class="btn form-submit-btn">Send Message</button>
            </form>
        </div>

        <div class="footer-links">
            <a href="mailto:your.email@example.com">Email Profile</a>
            <a href="https://linkedin.com" target="_blank">LinkedIn</a>
            <a href="https://github.com" target="_blank">GitHub Repository</a>
        </div>
        <p class="copyright">© 2026. Automated Git Deployment Framework Canvas Layout.</p>
    </footer>
